<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="260" fill="#0f172a"/>

  <text x="500" y="65" text-anchor="middle" fill="#e2e8f0" font-size="34" font-family="Arial, sans-serif" font-weight="700">
    Jacopo Andrea Bianco
  </text>

  <text x="500" y="105" text-anchor="middle" fill="#38bdf8" font-size="18" font-family="Arial, sans-serif">
    Computer Science • Artificial Intelligence • Distributed Systems
  </text>

  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.45">
    <line x1="180" y1="150" x2="370" y2="120"/>
    <line x1="180" y1="150" x2="370" y2="180"/>
    <line x1="180" y1="210" x2="370" y2="120"/>
    <line x1="180" y1="210" x2="370" y2="180"/>

    <line x1="370" y1="120" x2="560" y2="150"/>
    <line x1="370" y1="120" x2="560" y2="210"/>
    <line x1="370" y1="180" x2="560" y2="150"/>
    <line x1="370" y1="180" x2="560" y2="210"/>

    <line x1="560" y1="150" x2="750" y2="170"/>
    <line x1="560" y1="210" x2="750" y2="170"/>
  </g>

  <g fill="#38bdf8">
    <circle cx="180" cy="150" r="9">
      <animate attributeName="r" values="7;13;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="210" r="9">
      <animate attributeName="r" values="7;13;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="370" cy="120" r="9">
      <animate attributeName="r" values="7;13;7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="180" r="9">
      <animate attributeName="r" values="7;13;7" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="560" cy="150" r="9">
      <animate attributeName="r" values="7;13;7" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="210" r="9">
      <animate attributeName="r" values="7;13;7" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="170" r="11">
      <animate attributeName="r" values="9;16;9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
