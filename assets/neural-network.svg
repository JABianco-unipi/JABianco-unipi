<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 42px;
        font-weight: 700;
        fill: #e5e7eb;
        letter-spacing: 4px;
        filter: url(#glow);
      }

      .subtitle {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 17px;
        fill: #38bdf8;
        letter-spacing: 3px;
      }

      .matrix {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        fill: #a78bfa;
        opacity: 0.65;
      }

      .formula {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        fill: #22d3ee;
        opacity: 0.7;
      }

      .edge {
        stroke: url(#lineGradient);
        stroke-width: 1.4;
        opacity: 0.45;
        filter: url(#glow);
        stroke-dasharray: 9 14;
        animation: dash 7s linear infinite;
      }

      .edge-soft {
        stroke: #2563eb;
        stroke-width: 0.8;
        opacity: 0.25;
      }

      .node {
        fill: #38bdf8;
        filter: url(#glow);
        opacity: 0.95;
        animation: pulse 2.8s ease-in-out infinite;
      }

      .node-purple {
        fill: #8b5cf6;
      }

      .small-node {
        fill: #60a5fa;
        opacity: 0.8;
        filter: url(#glow);
      }

      .particle {
        fill: #ffffff;
        filter: url(#glow);
      }

      @keyframes dash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -180; }
      }

      @keyframes pulse {
        0%, 100% { r: 5; opacity: 0.75; }
        50% { r: 9; opacity: 1; }
      }

      @keyframes floatLeft {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(10px, -8px); }
      }

      @keyframes floatRight {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-12px, 7px); }
      }

      @keyframes fade {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }

      .float-left {
        animation: floatLeft 8s ease-in-out infinite;
      }

      .float-right {
        animation: floatRight 9s ease-in-out infinite;
      }

      .fade {
        animation: fade 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g opacity="0.25">
    <circle cx="100" cy="40" r="2" fill="#8b5cf6"/>
    <circle cx="180" cy="85" r="2" fill="#38bdf8"/>
    <circle cx="320" cy="50" r="2" fill="#60a5fa"/>
    <circle cx="890" cy="65" r="2" fill="#38bdf8"/>
    <circle cx="1040" cy="95" r="2" fill="#8b5cf6"/>
    <circle cx="1120" cy="35" r="2" fill="#38bdf8"/>
    <circle cx="960" cy="250" r="2" fill="#60a5fa"/>
    <circle cx="230" cy="245" r="2" fill="#8b5cf6"/>
  </g>

  <text x="36" y="42" class="matrix fade">0 1 1 0 1</text>
  <text x="36" y="64" class="matrix fade">1 0 1 1 0</text>
  <text x="36" y="86" class="matrix fade">0 1 0 0 1</text>

  <text x="910" y="58" class="formula fade">model.fit(data)</text>
  <text x="910" y="248" class="formula fade">z = Σ wᵢxᵢ + b</text>

  <g class="float-left">
    <line class="edge" x1="50" y1="190" x2="145" y2="115"/>
    <line class="edge" x1="50" y1="190" x2="160" y2="220"/>
    <line class="edge" x1="145" y1="115" x2="250" y2="70"/>
    <line class="edge" x1="145" y1="115" x2="310" y2="140"/>
    <line class="edge" x1="160" y1="220" x2="310" y2="140"/>
    <line class="edge" x1="160" y1="220" x2="280" y2="255"/>
    <line class="edge" x1="250" y1="70" x2="420" y2="120"/>
    <line class="edge" x1="310" y1="140" x2="420" y2="120"/>
    <line class="edge" x1="280" y1="255" x2="420" y2="120"/>

    <line class="edge-soft" x1="50" y1="190" x2="310" y2="140"/>
    <line class="edge-soft" x1="145" y1="115" x2="280" y2="255"/>
    <line class="edge-soft" x1="250" y1="70" x2="160" y2="220"/>

    <circle class="node node-purple" cx="50" cy="190" r="7"/>
    <circle class="node node-purple" cx="145" cy="115" r="7"/>
    <circle class="node node-purple" cx="160" cy="220" r="7"/>
    <circle class="node" cx="250" cy="70" r="7"/>
    <circle class="node" cx="310" cy="140" r="7"/>
    <circle class="node" cx="280" cy="255" r="7"/>
    <circle class="node" cx="420" cy="120" r="8"/>

    <circle class="particle" r="3">
      <animateMotion dur="4s" repeatCount="indefinite" path="M50 190 L145 115 L250 70 L420 120"/>
    </circle>
    <circle class="particle" r="2.5">
      <animateMotion dur="5s" repeatCount="indefinite" path="M160 220 L310 140 L420 120"/>
    </circle>
  </g>

  <g class="float-right">
    <line class="edge" x1="780" y1="220" x2="870" y2="145"/>
    <line class="edge" x1="780" y1="220" x2="905" y2="260"/>
    <line class="edge" x1="870" y1="145" x2="985" y2="95"/>
    <line class="edge" x1="870" y1="145" x2="1020" y2="190"/>
    <line class="edge" x1="905" y1="260" x2="1020" y2="190"/>
    <line class="edge" x1="985" y1="95" x2="1120" y2="150"/>
    <line class="edge" x1="1020" y1="190" x2="1120" y2="150"/>
    <line class="edge" x1="1120" y1="150" x2="1185" y2="90"/>

    <line class="edge-soft" x1="780" y1="220" x2="1020" y2="190"/>
    <line class="edge-soft" x1="870" y1="145" x2="1120" y2="150"/>
    <line class="edge-soft" x1="985" y1="95" x2="905" y2="260"/>

    <circle class="node" cx="780" cy="220" r="7"/>
    <circle class="node" cx="870" cy="145" r="7"/>
    <circle class="node" cx="905" cy="260" r="7"/>
    <circle class="node" cx="985" cy="95" r="7"/>
    <circle class="node" cx="1020" cy="190" r="7"/>
    <circle class="node" cx="1120" cy="150" r="9"/>
    <circle class="node node-purple" cx="1185" cy="90" r="7"/>

    <circle class="particle" r="3">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M780 220 L870 145 L985 95 L1120 150"/>
    </circle>
    <circle class="particle" r="2.5">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M905 260 L1020 190 L1120 150 L1185 90"/>
    </circle>
  </g>

  <g opacity="0.55">
    <path d="M0 260 C160 200, 260 285, 400 230 C570 160, 720 300, 900 215 C1030 155, 1120 190, 1200 145"
          fill="none" stroke="#22d3ee" stroke-width="1.2" filter="url(#glow)">
      <animate attributeName="d"
        dur="8s"
        repeatCount="indefinite"
        values="
        M0 260 C160 200, 260 285, 400 230 C570 160, 720 300, 900 215 C1030 155, 1120 190, 1200 145;
        M0 245 C150 280, 290 205, 430 250 C600 310, 720 150, 910 230 C1030 280, 1110 130, 1200 170;
        M0 260 C160 200, 260 285, 400 230 C570 160, 720 300, 900 215 C1030 155, 1120 190, 1200 145"/>
    </path>

    <path d="M0 285 C180 240, 280 300, 460 250 C620 210, 760 285, 930 245 C1060 210, 1120 250, 1200 215"
          fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.6" filter="url(#glow)">
      <animate attributeName="d"
        dur="10s"
        repeatCount="indefinite"
        values="
        M0 285 C180 240, 280 300, 460 250 C620 210, 760 285, 930 245 C1060 210, 1120 250, 1200 215;
        M0 300 C160 260, 300 230, 470 280 C650 315, 740 205, 950 260 C1080 300, 1110 205, 1200 235;
        M0 285 C180 240, 280 300, 460 250 C620 210, 760 285, 930 245 C1060 210, 1120 250, 1200 215"/>
    </path>
  </g>

  <g text-anchor="middle">
    <text x="600" y="135" class="title">Jacopo Andrea Bianco</text>
    <line x1="360" y1="158" x2="840" y2="158" stroke="url(#lineGradient)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="x1" values="420;330;420" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="780;870;780" dur="4s" repeatCount="indefinite"/>
    </line>
    <text x="600" y="190" class="subtitle">COMPUTER SCIENCE • ARTIFICIAL INTELLIGENCE • DISTRIBUTED SYSTEMS</text>
  </g>
</svg>
